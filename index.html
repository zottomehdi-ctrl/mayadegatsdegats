<!doctype html>
<html lang="fr" data-palette="bleu-nuit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F5F2">
  <title>Liaison Maya · Registre des propositions</title>
  <script>
    (function () {
      var palettes = ["petale", "poudre", "quartz", "velours", "minuit", "bleu-nuit", "bordeaux-ivoire", "vert-sapin", "ardoise", "bleu-petrole", "sable-brun", "prune", "terracotta", "graphite", "nuit-marine", "anthracite-or", "bordeaux-nocturne", "auto"];
      var choix = "bleu-nuit";
      try { choix = localStorage.getItem("liaison-maya:palette") || choix; } catch (e) {}
      if (palettes.indexOf(choix) === -1) choix = "bleu-nuit";
      if (choix === "auto") {
        choix = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "nuit-marine" : "bleu-nuit";
      }
      document.documentElement.setAttribute("data-palette", choix);
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <button type="button" class="lien-evitement" data-action="aller-contenu">Aller au contenu</button>
  <header class="entete">
    <div class="cadre entete-haut">
      <a class="marque" href="#/">
        <span class="sceau" aria-hidden="true">LM</span>
        <span class="marque-textes">
          <span class="marque-nom">Liaison Maya</span>
          <span class="marque-sous">Registre des propositions</span>
        </span>
      </a>
      <div class="entete-actions">
        <button type="button" class="bouton-entete bouton-aide" data-action="aide" aria-label="Afficher l'aide de démarrage" title="Aide">?</button>
        <button type="button" class="bouton-entete bouton-palette" data-action="ouvrir-palettes" aria-haspopup="dialog" aria-controls="panneau-palettes" aria-label="Palette de couleurs">
          <svg class="icone-palette" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
            <circle class="icone-palette-a" cx="7" cy="8" r="4.5"></circle>
            <circle class="icone-palette-b" cx="13" cy="8" r="4.5"></circle>
            <circle class="icone-palette-c" cx="10" cy="13" r="4.5"></circle>
          </svg>
          <span>Palette</span>
        </button>
      </div>
    </div>
    <nav class="nav" aria-label="Sections">
      <div class="cadre nav-cadre">
        <a class="nav-lien" href="#/" data-vue="recap"><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 4.5h7M6 8h7M6 11.5h7"/><path d="M3 4.5h.01M3 8h.01M3 11.5h.01"/></svg><span class="nav-long">Récapitulatif</span><span class="nav-court" aria-hidden="true">Récap</span></a>
        <a class="nav-lien" href="#/rediscuter" data-vue="rediscuter"><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3.8L3.4 6.4 6 9"/><path d="M3.6 6.4h6.1a2.9 2.9 0 0 1 0 5.8H7.2"/></svg><span class="nav-long">À rediscuter</span><span class="nav-court" aria-hidden="true">Rediscuter</span> <span class="nav-compte" id="compte-rediscuter"></span></a>
        <a class="nav-lien" href="#/valides" data-vue="valides"><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 2.5h5.2L12 5.3v8.2H4z"/><path d="M9 2.5v3h3"/><path d="M6 9.4l1.4 1.4 2.6-2.8"/></svg><span class="nav-long">Textes validés</span><span class="nav-court" aria-hidden="true">Validés</span></a>
        <a class="nav-lien" href="#/archives" data-vue="archives"><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="3" width="11" height="3" rx=".6"/><path d="M3.5 6v6.5h9V6"/><path d="M6.5 8.6h3"/></svg><span class="nav-long">Archives</span><span class="nav-court" aria-hidden="true">Archives</span> <span class="nav-compte nav-compte--neutre" id="compte-archives"></span></a>
        <a class="nav-lien nav-lien--ajouter" href="#/ajouter" data-vue="ajouter"><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg><span class="nav-long">Ajouter</span><span class="nav-court" aria-hidden="true">Ajouter</span></a>
      </div>
    </nav>
  </header>

  <main id="app" class="cadre" tabindex="-1">
    <div aria-hidden="true">
      <div class="squelette" style="width: 38%; height: 30px;"></div>
      <div class="squelette" style="width: 62%; margin-top: 18px;"></div>
    </div>
  </main>

  <dialog class="panneau" id="panneau-palettes" aria-labelledby="titre-palettes"></dialog>

  <div class="toast" id="toast">
    <p class="toast-message" role="status" aria-live="polite"></p>
    <button type="button" class="toast-annuler" data-action="annuler-toast" hidden>Annuler</button>
    <span class="toast-delai" aria-hidden="true"></span>
  </div>

  <button type="button" class="aller-decision" id="aller-decision" data-action="aller-decision" hidden><svg class="icone" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3v9.5M4 8.6l4 4 4-4"/></svg><span>Décider</span></button>

  <p class="raccourcis" id="raccourcis" hidden>
    <span><kbd>V</kbd> valider</span>
    <span><kbd>R</kbd> refuser</span>
    <span><kbd>←</kbd> <kbd>→</kbd> point précédent ou suivant</span>
  </p>

  <noscript>
    <div class="cadre"><p class="bandeau bandeau--erreur">Liaison Maya nécessite JavaScript pour s'afficher.</p></div>
  </noscript>
</body>
</html>
