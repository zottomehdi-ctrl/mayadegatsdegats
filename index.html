<!doctype html>
<html lang="fr" data-palette="bleu-nuit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F5F2">
  <title>Liaison Maya · Registre des propositions</title>
  <script>
    (function () {
      var palettes = ["petale", "poudre", "quartz", "velours", "minuit", "bleu-nuit", "bordeaux-ivoire", "vert-sapin", "ardoise", "bleu-petrole", "sable-brun", "prune", "terracotta", "graphite", "nuit-marine", "anthracite-or", "bordeaux-nocturne", "auto"];
      var choix = "bleu-nuit";
      try { choix = localStorage.getItem("liaison-maya:palette") || choix; } catch (e) {}
      if (palettes.indexOf(choix) === -1) choix = "bleu-nuit";
      if (choix === "auto") {
        choix = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "nuit-marine" : "bleu-nuit";
      }
      document.documentElement.setAttribute("data-palette", choix);
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <header class="entete">
    <div class="cadre entete-haut">
      <a class="marque" href="#/">
        <span class="sceau" aria-hidden="true">LM</span>
        <span class="marque-textes">
          <span class="marque-nom">Liaison Maya</span>
          <span class="marque-sous">Registre des propositions</span>
        </span>
      </a>
      <div class="entete-actions">
        <button type="button" class="bouton-entete bouton-aide" data-action="aide" aria-label="Afficher l'aide de démarrage" title="Aide">?</button>
        <button type="button" class="bouton-entete bouton-palette" data-action="ouvrir-palettes" aria-haspopup="dialog" aria-controls="panneau-palettes" aria-label="Palette de couleurs">
          <svg class="icone-palette" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
            <circle class="icone-palette-a" cx="7" cy="8" r="4.5"></circle>
            <circle class="icone-palette-b" cx="13" cy="8" r="4.5"></circle>
            <circle class="icone-palette-c" cx="10" cy="13" r="4.5"></circle>
          </svg>
          <span>Palette</span>
        </button>
      </div>
    </div>
    <nav class="nav" aria-label="Sections">
      <div class="cadre nav-cadre">
        <a class="nav-lien" href="#/" data-vue="recap">Récapitulatif</a>
        <a class="nav-lien" href="#/rediscuter" data-vue="rediscuter">À rediscuter <span class="nav-compte" id="compte-rediscuter"></span></a>
        <a class="nav-lien" href="#/valides" data-vue="valides">Textes validés</a>
      </div>
    </nav>
  </header>

  <main id="app" class="cadre" tabindex="-1">
    <div aria-hidden="true">
      <div class="squelette" style="width: 38%; height: 30px;"></div>
      <div class="squelette" style="width: 62%; margin-top: 18px;"></div>
    </div>
  </main>

  <dialog class="panneau" id="panneau-palettes" aria-labelledby="titre-palettes"></dialog>

  <div class="toast" id="toast">
    <p class="toast-message" role="status" aria-live="polite"></p>
    <button type="button" class="toast-annuler" data-action="annuler-toast" hidden>Annuler</button>
    <span class="toast-delai" aria-hidden="true"></span>
  </div>

  <p class="raccourcis" id="raccourcis" hidden>
    <span><kbd>V</kbd> valider</span>
    <span><kbd>R</kbd> refuser</span>
    <span><kbd>←</kbd> <kbd>→</kbd> point précédent ou suivant</span>
  </p>

  <noscript>
    <div class="cadre"><p class="bandeau bandeau--erreur">Liaison Maya nécessite JavaScript pour s'afficher.</p></div>
  </noscript>
</body>
</html>
